[project]
name = "questerai"
version = "0.1.0"
description = "AI-powered assistant for Requirements Engineers during stakeholder interviews. Uses LLMs and semantic retrieval to discover, refine, and validate software requirements."
readme = "README.md"
authors = [
    { name = "PauXfighter", email = "pauxfighter@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.2",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "uuid6>=2025.0.1",
]

[project.scripts]
questerai = "questerai:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
